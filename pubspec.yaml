name: light_speed_vpn
description: "Light speed 🔥 independent multi-protocol VPN client."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.2 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  # 1.1.5 is the stable line paired with sing-box/libbox 1.13.15.
  # 1.2.0 moved the Android build to a newer Gradle/SDK matrix.
  flutter_sing_box: 1.1.5
  mmkv: 2.4.2
  http: 1.6.0
  shared_preferences: 2.5.3
  url_launcher: 6.3.2
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
