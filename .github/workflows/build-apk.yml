name: Build Light speed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Light speed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Recreate clean Android project
        run: |
          set -euo pipefail
          rm -rf android
          flutter create -t app . --platforms=android --project-name=light_speed_vpn --org=com.lightspeed --no-pub

      - name: Configure Android toolchain and local libbox repository
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('android/settings.gradle.kts')
          s = settings.read_text()
          s = re.sub(r'id\("com\.android\.application"\) version "[^"]+" apply false',
                     'id("com.android.application") version "8.13.2" apply false', s)
          s = re.sub(r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+" apply false',
                     'id("org.jetbrains.kotlin.android") version "2.3.20" apply false', s)
          if 'dependencyResolutionManagement {' in s:
              start = s.index('dependencyResolutionManagement {')
              end = s.index('\n\nplugins {', start)
              s = s[:start] + s[end+2:]
          settings.write_text(s)

          build = Path('android/build.gradle.kts')
          b = build.read_text()
          if 'maven { url = uri("$rootDir/local-maven") }' not in b:
              b = b.replace('allprojects {\n    repositories {', 'allprojects {\n    repositories {\n        maven { url = uri("$rootDir/local-maven") }')
          build.write_text(b)

          app = Path('android/app/build.gradle.kts')
          a = app.read_text()
          a = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', a)
          a = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 26', a)
          a = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', a)
          if 'JavaVersion.VERSION_17' not in a:
              a = a.replace('    defaultConfig {', '    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }\n\n    kotlinOptions {\n        jvmTarget = JavaVersion.VERSION_17.toString()\n    }\n\n    defaultConfig {')
          elif 'isCoreLibraryDesugaringEnabled = true' not in a:
              a = a.replace('        targetCompatibility = JavaVersion.VERSION_17\n', '        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n')
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in a:
              marker = 'dependencies {\n'
              if marker in a:
                  a = a.replace(marker, marker + '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n', 1)
              else:
                  a += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          app.write_text(a)

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          w = wrapper.read_text()
          w = re.sub(r'gradle-[0-9.]+-all\.zip', 'gradle-8.14-all.zip', w)
          wrapper.write_text(w)
          PY

          echo '--- settings.gradle.kts ---'
          cat android/settings.gradle.kts
          echo '--- android/build.gradle.kts ---'
          cat android/build.gradle.kts
          echo '--- app/build.gradle.kts ---'
          grep -n -E 'compileSdk|minSdk|targetSdk|VERSION_17|desugar' android/app/build.gradle.kts || true
          echo '--- Gradle wrapper ---'
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Vendor pinned libbox 1.13.15 into local Maven repository
        run: |
          set -euo pipefail
          VERSION='1.13.15'
          BASE="https://jitpack.io/com/github/singbox-android/libbox/${VERSION}"
          DEST="android/local-maven/com/github/singbox-android/libbox/${VERSION}"
          mkdir -p "$DEST"
          curl -fL --retry 5 --retry-delay 2 -sS "$BASE/libbox-${VERSION}.pom" -o "$DEST/libbox-${VERSION}.pom"
          curl -fL --retry 5 --retry-delay 2 -sS "$BASE/libbox-${VERSION}.aar" -o "$DEST/libbox-${VERSION}.aar"
          test -s "$DEST/libbox-${VERSION}.pom"
          test -s "$DEST/libbox-${VERSION}.aar"
          echo '--- vendored libbox ---'
          ls -lh "$DEST"
          sha256sum "$DEST/libbox-${VERSION}.aar"

      - name: Get dependencies
        run: flutter pub get

      - name: Verify local libbox repository
        run: |
          set -euo pipefail
          test -s android/local-maven/com/github/singbox-android/libbox/1.13.15/libbox-1.13.15.aar
          test -s android/local-maven/com/github/singbox-android/libbox/1.13.15/libbox-1.13.15.pom
          echo 'Local Maven libbox 1.13.15 is ready.'

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs/flutter-apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK=$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

