name: Build Light Speed APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.lightspeed.vpn .

      - name: Prepare libbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/local-maven/com/github/singbox-android/libbox/1.14.0
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/singbox-android/libbox/releases/download/1.14.0/libbox.aar \
            -o android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.aar
          test -s android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.aar
          unzip -t android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.aar >/dev/null
          cat > android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.pom <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.singbox-android</groupId>
            <artifactId>libbox</artifactId>
            <version>1.14.0</version>
            <packaging>aar</packaging>
          </project>
          EOF

      - name: Configure Android repositories
        shell: python
        run: |
          from pathlib import Path

          settings = Path('android/settings.gradle.kts')
          text = settings.read_text()
          marker = 'maven { url = uri("$rootDir/local-maven") }'
          if marker not in text:
              needle = 'repositories {\n'
              if needle not in text:
                  raise SystemExit('repositories block not found in settings.gradle.kts')
              text = text.replace(needle, needle + '        ' + marker + '\n', 1)
          settings.write_text(text)

          app = Path('android/app/build.gradle.kts')
          text = app.read_text()
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          app.write_text(text)

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
