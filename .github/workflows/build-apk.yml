name: Build Light speed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Light speed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Recreate clean Android project
        run: |
          set -euo pipefail
          rm -rf android
          flutter create -t app . --platforms=android --project-name=light_speed_vpn --org=com.lightspeed --no-pub

      - name: Configure Android repositories for sing-box
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          block = '''\n\n// Light speed: repository required by flutter_sing_box/libbox.\ndependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url = uri("https://jitpack.io") }\n    }\n}\n'''
          if 'dependencyResolutionManagement {' not in s:
              s += block
          elif 'https://jitpack.io' not in s:
              marker = 'dependencyResolutionManagement {'
              start = s.index(marker)
              repos = s.index('repositories {', start)
              insert_at = s.index('\n', repos) + 1
              s = s[:insert_at] + '        maven { url = uri("https://jitpack.io") }\n' + s[insert_at:]
          p.write_text(s)
          PY
          grep -n -A12 -B2 "dependencyResolutionManagement" android/settings.gradle.kts

      - name: Patch persistent auto-connect and failover
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          marker = '// Light speed: persistent health monitor'
          if marker not in s:
              s = s.replace(
                  '  String? activeOutbound;\n',
                  '  String? activeOutbound;\n\n'
                  '  Timer? healthTimer;\n'
                  '  bool healthCheckRunning = false;\n'
                  '  int consecutiveHealthFailures = 0;\n'
              )
              monitor = r'''\n  // Light speed: persistent health monitor\n  bool _hasHealthyNativeOutbound() {\n    for (final group in groups) {\n      final items = group.items;\n      if (items == null || items.isEmpty || !group.selectable) continue;\n      for (final item in items) {\n        if (item.urlTestDelay > 0 && item.urlTestDelay < 65000) return true;\n      }\n    }\n    return false;\n  }\n\n  void _startHealthMonitor() {\n    _stopHealthMonitor();\n    consecutiveHealthFailures = 0;\n    healthTimer = Timer.periodic(const Duration(seconds: 45), (_) {\n      _runHealthCheck();\n    });\n  }\n\n  void _stopHealthMonitor() {\n    healthTimer?.cancel();\n    healthTimer = null;\n    healthCheckRunning = false;\n    consecutiveHealthFailures = 0;\n  }\n\n  Future<void> _runHealthCheck() async {\n    if (!connected || connecting || !autoConnect || healthCheckRunning) return;\n    healthCheckRunning = true;\n    try {\n      await _runNativeUrlTests();\n      if (_hasHealthyNativeOutbound()) {\n        consecutiveHealthFailures = 0;\n        await _selectFastestNativeOutbound();\n      } else {\n        consecutiveHealthFailures++;\n        if (mounted) {\n          setState(() {\n            status = 'سرورها پاسخ نمی‌دهند • تلاش ${consecutiveHealthFailures}/3';\n          });\n        }\n        if (consecutiveHealthFailures >= 3) {\n          consecutiveHealthFailures = 0;\n          if (mounted) {\n            setState(() {\n              connected = false;\n              activeOutbound = null;\n              connecting = false;\n              status = 'اتصال از دست رفت؛ در حال انتخاب سرور سالم...';\n            });\n          }\n          try {\n            await vpn.stopVpn();\n          } catch (_) {}\n          await Future<void>.delayed(const Duration(milliseconds: 500));\n          if (mounted && autoConnect) {\n            await connectBestServer();\n          }\n        }\n      }\n    } catch (e) {\n      consecutiveHealthFailures++;\n      debugPrint('health check failed: $e');\n    } finally {\n      healthCheckRunning = false;\n    }\n  }\n'''
              s = s.replace('  Future<void> connectBestServer() async {', monitor + '\n  Future<void> connectBestServer() async {')
              s = s.replace(
                  "      if (!mounted) return;\n      setState(() {\n        connected = true;",
                  "      _startHealthMonitor();\n\n      if (!mounted) return;\n      setState(() {\n        connected = true;",
                  1)
              s = s.replace(
                  "    } catch (e) {\n      try {\n        await vpn.stopVpn();",
                  "    } catch (e) {\n      _stopHealthMonitor();\n      try {\n        await vpn.stopVpn();",
                  1)
              s = s.replace(
                  '  Future<void> disconnectVpn() async {\n',
                  '  Future<void> disconnectVpn() async {\n    _stopHealthMonitor();\n',
                  1)
              s = s.replace(
                  '  void dispose() {\n',
                  '  void dispose() {\n    _stopHealthMonitor();\n',
                  1)
              p.write_text(s)
          PY

          git diff -- lib/main.dart
          if ! git diff --quiet -- lib/main.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/main.dart
            git commit -m 'Add persistent auto-connect failover [skip ci]'
            git push origin HEAD:main
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs/flutter-apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK=$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

