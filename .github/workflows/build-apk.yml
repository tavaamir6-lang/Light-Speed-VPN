name: Build Light speed 🔥 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Light speed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Complete Flutter Android project files
        run: flutter create . --platforms=android --project-name=light_speed_vpn --org=com.lightspeed

      - name: Verify project
        run: |
          set -euo pipefail
          grep -E '^(name:|version:)' pubspec.yaml
          test -f lib/main.dart
          test -f android/app/build.gradle
          test -f android/gradlew

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          find build/app/outputs -type f -name '*.apk' -print
          test -n "$(find build/app/outputs -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
