name: Build Light Speed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.lightspeed.vpn .

      - name: Configure Android for sing-box
        run: |
          set -euo pipefail
          mkdir -p android/local-maven/com/github/singbox-android/libbox/1.14.0

          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/singbox-android/libbox/releases/download/1.14.0/libbox.aar" \
            -o android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.aar
          test -s android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.aar
          unzip -t android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.aar >/dev/null

          cat > android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.pom <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.singbox-android</groupId>
            <artifactId>libbox</artifactId>
            <version>1.14.0</version>
            <packaging>aar</packaging>
          </project>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          settings = Path('android/settings.gradle.kts')
          text = settings.read_text()
          local_repo = '        maven { url = uri("$rootDir/local-maven") }'

          if 'dependencyResolutionManagement {' in text:
              start = text.index('dependencyResolutionManagement {')
              repo_pos = text.find('repositories {', start)
              if repo_pos < 0:
                  raise SystemExit('dependencyResolutionManagement exists but repositories block is missing')
              if local_repo not in text:
                  insert_at = repo_pos + len('repositories {')
                  text = text[:insert_at] + '\n' + local_repo + text[insert_at:]
          else:
              block = '''\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\n    repositories {\n        maven { url = uri("$rootDir/local-maven") }\n        google()\n        mavenCentral()\n        maven("https://storage.googleapis.com/download.flutter.io")\n    }\n}\n'''
              anchor = '\nplugins {'
              if anchor not in text:
                  raise SystemExit('plugins block not found in generated settings.gradle.kts')
              text = text.replace(anchor, block + anchor, 1)

          settings.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37')
          gradle.write_text(text)
          PY

      - name: Verify Gradle configuration
        run: |
          set -euo pipefail
          grep -n "dependencyResolutionManagement\|local-maven\|RepositoriesMode" android/settings.gradle.kts
          test -f android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.aar
          test -f android/local-maven/com/github/singbox-android/libbox/1.14.0/libbox-1.14.0.pom

      - name: Get packages
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Analyze app only
        run: flutter analyze lib --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk