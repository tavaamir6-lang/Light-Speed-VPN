name: Build Light speed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Light speed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Recreate clean Android project
        run: |
          set -euo pipefail
          rm -rf android
          flutter create -t app . --platforms=android --project-name=light_speed_vpn --org=com.lightspeed

      - name: Prepare pinned sing-box libbox 1.13.15
        run: |
          set -euo pipefail
          VERSION="1.13.15"
          REPO="android/local-maven/com/github/singbox-android/libbox/${VERSION}"
          mkdir -p "$REPO"
          curl -fL --retry 5 --retry-all-errors \
            "https://jitpack.io/com/github/singbox-android/libbox/${VERSION}/libbox-${VERSION}.aar" \
            -o "$REPO/libbox-${VERSION}.aar"
          cat > "$REPO/libbox-${VERSION}.pom" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.singbox-android</groupId>
            <artifactId>libbox</artifactId>
            <version>1.13.15</version>
            <packaging>aar</packaging>
          </project>
          EOF
          ls -lh "$REPO"

      - name: Add local Maven repository for libbox
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle.kts")
          s = p.read_text()
          if 'uri("local-maven")' not in s:
              marker = "allprojects {\n    repositories {"
              if marker not in s:
                  raise SystemExit("allprojects repositories block not found")
              s = s.replace(marker, marker + '\n        maven { url = uri("local-maven") }', 1)
              p.write_text(s)
          PY
          grep -n -A8 "allprojects" android/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs/flutter-apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

