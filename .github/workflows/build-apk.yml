name: Build Light Speed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.lightspeed.vpn .

      - name: Configure Android for sing-box
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('android/settings.gradle.kts')
          text = settings.read_text()
          marker = 'repositories {'
          if marker in text and 'https://jitpack.io' not in text:
              text = text.replace(
                  marker,
                  marker + '\n        maven { url = uri("https://jitpack.io") }',
                  1,
              )
          settings.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'compileSdk = 37' not in text:
              text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37')
          gradle.write_text(text)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Analyze app only
        run: flutter analyze lib --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
