name: Build Light speed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Light speed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Recreate clean Android project
        run: |
          set -euo pipefail
          rm -rf android
          flutter create -t app . --platforms=android --project-name=light_speed_vpn --org=com.lightspeed --no-pub

      - name: Align Android toolchain for sing-box 1.13.15
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('android/settings.gradle.kts')
          s = settings.read_text()
          s = re.sub(r'id\("com\.android\.application"\) version "[^"]+" apply false',
                     'id("com.android.application") version "8.13.2" apply false', s)
          s = re.sub(r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+" apply false',
                     'id("org.jetbrains.kotlin.android") version "2.3.20" apply false', s)

          # JitPack is required for the flutter_sing_box Android libbox artifact.
          # Flutter 3.47's generated template puts plugin repositories inside
          # pluginManagement; that is NOT enough for normal dependencies.
          # Add a dedicated dependencyResolutionManagement block before plugins.
          if 'dependencyResolutionManagement {' not in s:
              s = s.replace(
                  '\nplugins {',
                  '\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\n    repositories {\n        google()\n        mavenCentral()\n        maven { url = uri("https://jitpack.io") }\n    }\n}\n\nplugins {',
                  1,
              )
          elif 'https://jitpack.io' not in s:
              marker = 'dependencyResolutionManagement {\n'
              s = s.replace(
                  marker,
                  marker + '    repositories {\n        google()\n        mavenCentral()\n        maven { url = uri("https://jitpack.io") }\n    }\n',
                  1,
              )
          settings.write_text(s)

          app = Path('android/app/build.gradle.kts')
          a = app.read_text()
          a = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', a)
          a = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 26', a)
          a = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', a)
          if 'JavaVersion.VERSION_17' not in a:
              a = a.replace('    defaultConfig {', '    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = JavaVersion.VERSION_17.toString()\n    }\n\n    defaultConfig {')
          app.write_text(a)

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          w = wrapper.read_text()
          w = re.sub(r'gradle-[0-9.]+-all\.zip', 'gradle-8.14-all.zip', w)
          wrapper.write_text(w)
          PY

          echo '--- settings.gradle.kts ---'
          cat android/settings.gradle.kts
          echo '--- app/build.gradle.kts ---'
          grep -n -E 'compileSdk|minSdk|targetSdk|VERSION_17' android/app/build.gradle.kts || true
          echo '--- Gradle wrapper ---'
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Verify libbox repository resolution
        run: |
          set -euo pipefail
          echo 'Checking JitPack libbox 1.13.15 metadata...'
          curl -fL --retry 3 --retry-delay 2 -sS \
            https://jitpack.io/com/github/singbox-android/libbox/1.13.15/libbox-1.13.15.pom \
            -o /tmp/libbox-1.13.15.pom
          test -s /tmp/libbox-1.13.15.pom
          head -n 20 /tmp/libbox-1.13.15.pom

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs/flutter-apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK=$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

