name: Clean Build Light speed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Recreate clean Android project
        run: |
          set -euo pipefail
          rm -rf android
          flutter create -t app . --platforms=android --project-name=light_speed_vpn --org=com.lightspeed --no-pub

      - name: Configure Android repositories for sing-box
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle.kts')
          s = p.read_text()
          if 'https://jitpack.io' not in s:
              marker = 'dependencyResolutionManagement {'
              if marker in s:
                  start = s.index(marker)
                  repos = s.index('repositories {', start)
                  insert_at = s.index('\n', repos) + 1
                  s = s[:insert_at] + '        maven { url = uri("https://jitpack.io") }\n' + s[insert_at:]
              else:
                  s += '\n\ndependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url = uri("https://jitpack.io") }\n    }\n}\n'
          p.write_text(s)
          PY

      - name: Repair malformed health-monitor patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          start = s.find(r'\n  // Light speed: persistent health monitor\n')
          end = s.find(r'\n  Future<void> connectBestServer() async {')
          if start != -1 and end != -1 and start < end:
              s = s[:start] + '\n\n  Future<void> connectBestServer() async {' + s[end + len(r'\n  Future<void> connectBestServer() async {'):]
          s = s.replace("  Timer? healthTimer;\n  bool healthCheckRunning = false;\n  int consecutiveHealthFailures = 0;\n", '')
          s = s.replace('    _stopHealthMonitor();\n', '')
          p.write_text(s)
          PY
          grep -n "persistent health monitor\|healthTimer\|healthCheckRunning\|consecutiveHealthFailures" lib/main.dart || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs/flutter-apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK=$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: light-speed-vpn-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
